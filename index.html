<!doctype html>
<!--
  临时暂停页。恢复方式（在仓库根目录执行）：
  1) git checkout 26bfae1 -- index.html sw.js
  2) npm run build
  3) git add -A && git commit -m "Restore Feynman Classroom" && git push origin main
  暂停期间请勿运行 npm run build，它会用构建产物覆盖本页。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>暂停服务 · 费曼小课堂</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f6f3eb;
      color: #1f2a2a;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      text-align: center;
    }
    .card {
      width: min(100%, 560px);
      padding: 48px 36px;
      border: 1px solid #ded8c8;
      border-radius: 20px;
      background: #fffdf8;
      box-shadow: 0 18px 48px rgba(31, 42, 42, 0.06);
    }
    .eyebrow {
      margin: 0;
      color: #5f7247;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin: 24px auto 0;
      border-radius: 18px;
      background: #eef4ef;
      color: #174f43;
      font-family: Georgia, "Songti SC", serif;
      font-size: 30px;
    }
    h1 {
      margin: 22px 0 0;
      font-size: 32px;
      font-weight: 700;
    }
    p {
      margin: 16px 0 0;
      color: #45524f;
      font-size: 15px;
      line-height: 1.8;
    }
    .note {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e8e3d8;
      color: #5c6861;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">FEYNMAN CLASSROOM</p>
    <div class="mark" aria-hidden="true">停</div>
    <h1>暂停服务</h1>
    <p>费曼小课堂正在维护，暂时无法使用。</p>
    <p>我们会在准备完成后重新开放，感谢你的耐心。</p>
    <p class="note">如需反馈，请到项目仓库的 Issues 留言。</p>
  </main>
</body>
</html>
